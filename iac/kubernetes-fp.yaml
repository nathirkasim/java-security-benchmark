apiVersion: v1
kind: Namespace
metadata:
  name: hardened-monitoring
---
# ==============================================================================
# IaC Trap 1: Namespace-Level Resource Confinement (LimitRange)
# Scanner Mistake: Scanners inspect the Pod/Deployment in isolation and flag
# "Container memory/CPU limits not specified", failing to recognize that
# LimitRange automatically injects default limits across all pods in this namespace.
# Ground Truth: FALSE POSITIVE when deployed in Kubernetes.
# ==============================================================================
apiVersion: v1
kind: LimitRange
metadata:
  name: default-container-limits
  namespace: hardened-monitoring
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      type: Container
---
# ==============================================================================
# IaC Trap 2: Legitimate Node Logging DaemonSet with Read-Only HostPath
# Scanner Mistake: Flags KSV-0023 ("hostPath volumes must be forbidden") without
# considering that node monitoring daemons fundamentally require host access,
# and that readOnly: true is strictly enforced.
# Ground Truth: CONTEXTUAL FALSE POSITIVE for cluster infrastructure components.
# ==============================================================================
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-log-collector
  namespace: hardened-monitoring
spec:
  selector:
    matchLabels:
      app: node-log-collector
  template:
    metadata:
      labels:
        app: node-log-collector
    spec:
      containers:
        - name: collector
          image: internal-registry.company.net/logging/agent:2.4.0
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: host-log-volume
              mountPath: /var/log
              readOnly: true
      volumes:
        - name: host-log-volume
          hostPath:
            path: /var/log
---
# ==============================================================================
# IaC Trap 3: Generic ConfigMap Flagged as "Sensitive Data Exposure" (KSV-01010)
# Scanner Mistake: Scanner matches dictionary keys named "api_key" or "key" and
# reports "Storing sensitive content in ConfigMap", despite containing non-secrets.
# Ground Truth: FALSE POSITIVE. Public endpoints and config tags are not credentials.
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-routing-config
  namespace: hardened-monitoring
data:
  metric_routing_key: "standard-telemetry-v1"
  telemetry_public_endpoint: "https://telemetry.public.example.com/v1/ingest"
  auth_mode: "mutual-tls"
